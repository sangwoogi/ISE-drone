# ros_gz_bridge parameter_bridge config for the PX4 gz_x500_depth model (Phase 3).
# Gazebo topic names depend on the world/model instance; verify with `gz topic -l` and adjust here only.
# All ROS-side names are the common sensor contract (docs/ros_interfaces.md).
- ros_topic_name: "/camera/color/image_raw"
  gz_topic_name: "/world/default/model/x500_depth_0/link/camera_link/sensor/IMX214/image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS
- ros_topic_name: "/camera/color/camera_info"
  gz_topic_name: "/world/default/model/x500_depth_0/link/camera_link/sensor/IMX214/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS
- ros_topic_name: "/camera/depth/image_raw"
  gz_topic_name: "/depth_camera"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS
- ros_topic_name: "/camera/depth/points"
  gz_topic_name: "/depth_camera/points"
  ros_type_name: "sensor_msgs/msg/PointCloud2"
  gz_type_name: "gz.msgs.PointCloudPacked"
  direction: GZ_TO_ROS
- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS
