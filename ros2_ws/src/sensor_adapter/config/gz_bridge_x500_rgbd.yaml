# ros_gz_bridge config for the repo model simulation/models/x500_rgbd (OakD-Lite-RGBD, registered 640x480 @ 20 Hz).
# Gazebo topics come from the sensor <topic> tags: rgb_camera, depth_camera. Verified with `gz topic -l`:
#   /rgb_camera, /depth_camera, /depth_camera/points, and ONE /camera_info (both sensors publish there, 2x20 Hz).
#   The depth camera has no separate camera_info; the adapter republishes the colour info as depth info (registered).
- ros_topic_name: "/camera/color/image_raw"
  gz_topic_name: "/rgb_camera"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS
- ros_topic_name: "/camera/color/camera_info"
  gz_topic_name: "/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS
- ros_topic_name: "/camera/depth/image_raw"
  gz_topic_name: "/depth_camera"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS
- ros_topic_name: "/camera/depth/points"
  gz_topic_name: "/depth_camera/points"
  ros_type_name: "sensor_msgs/msg/PointCloud2"
  gz_type_name: "gz.msgs.PointCloudPacked"
  direction: GZ_TO_ROS
- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS
