# px4_bridge parameters. Topic names are pinned to PX4 v1.17.0 + px4_msgs v1.17.0.
# PX4 >= 1.16 appends "_v<N>" to topics whose message has MESSAGE_VERSION > 0
# (see src/modules/uxrce_dds_client/utilities.hpp::generate_topic_name).
/**:
  ros__parameters:
    topics:
      # PX4 -> ROS 2
      vehicle_status:         /fmu/out/vehicle_status_v1
      vehicle_local_position: /fmu/out/vehicle_local_position_v1
      vehicle_land_detected:  /fmu/out/vehicle_land_detected
      vehicle_command_ack:    /fmu/out/vehicle_command_ack
      # ROS 2 -> PX4
      offboard_control_mode:  /fmu/in/offboard_control_mode
      trajectory_setpoint:    /fmu/in/trajectory_setpoint
      vehicle_command:        /fmu/in/vehicle_command

    # Offboard heartbeat / setpoint stream rate [Hz]. PX4 drops offboard below ~2 Hz.
    stream_rate_hz: 10.0

    # Arrival criteria used by goto()/takeoff()
    position_tolerance_m: 0.20
    velocity_tolerance_mps: 0.20
    settle_time_s: 0.5

    # Timeouts [s]
    connection_timeout_s: 60.0
    arm_timeout_s: 15.0
    goto_timeout_s: 60.0
    land_timeout_s: 60.0
